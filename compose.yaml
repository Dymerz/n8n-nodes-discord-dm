services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7
    working_dir: /home/node/.n8n/custom/n8n-nodes-discord-triggers
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        npm install --omit=dev --include=peer --no-package-lock
        --ignore-scripts --no-audit --no-fund &&
        n8n start
    ports:
      - "5678:5678"
    environment:
      N8N_DEV_RELOAD: "true"
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/home/node/.n8n/custom/n8n-nodes-discord-triggers
      - node_modules:/home/node/.n8n/custom/n8n-nodes-discord-triggers/node_modules

volumes:
  n8n_data:
  node_modules:
